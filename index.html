<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PianoPocket - Chord & Arp Desk</title>
<style>
body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 20px; }
.container { max-width: 800px; margin: auto; }
h1 { color: #4af; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
label { display: block; margin-bottom: 5px; }
input, select, button { padding: 8px; font-size: 16px; }
button { background: #4af; color: #000; border: none; cursor: pointer; }
button:disabled { opacity: 0.5; }
#status { margin: 10px 0; }
.playhead { height: 20px; background: #222; margin: 10px 0; position: relative; }
.playhead div { height: 100%; background: #4af; width: 0%; }
</style>
</head>
<body>
<div class="container">
<h1>PianoPocket</h1>
<p>Sketch piano chords and arpeggios over your progression. Live Salamander piano samples. Grid-perfect export.</p>
<div id="status">Tap to start audio</div>
<div class="controls">
<div><label>BPM <input type="number" id="bpm" min="60" max="180" value="92"></label></div>
<div><label>Key <select id="key"><option>C</option><option>G</option><option>D</option><option>A</option><option>E</option><option>B</option><option>F#</option><option>Db</option><option>Ab</option><option>Eb</option><option>Bb</option><option>F</option></select></label></div>
<div><label>Chords (4) <input type="text" id="chords" value="Am F C G" placeholder="Am F C G"></label></div>
<div><label>Bars <input type="number" id="bars" min="1" max="16" value="8"></label></div>
<div><label>Pattern <select id="pattern"><option value="block">Block chords</option><option value="arpup">Arp up</option><option value="arpdown">Arp down</option><option value="arpupdown">Arp up-down</option></select></label></div>
<div><label><input type="checkbox" id="muteChords"> Mute chords</label></div>
<div><label><input type="checkbox" id="muteArp"> Mute arp</label></div>
</div>
<button id="play">Play</button> <button id="stop">Stop</button> <button id="export">Export WAV + MIDI</button>
<div class="playhead"><div id="progress"></div></div>
<p>Samples: Salamander Grand Piano (CC BY 3.0 Alexander Holm). Preloaded: A3, C4, A4, C5. Pitch within ±4 semitones.</p>
<p>iOS: silent switch mutes Web Audio.</p>
</div>
<script>
const LOOKAHEAD_MS = 25;
const SCHEDULE_AHEAD = 0.12;
let ctx, nextStepTime, step, timerId, isPlaying = false;
let activeSources = [];
let samples = {};
let sampleBuffers = {};
const noteMap = { 'A3': 57, 'C4': 60, 'A4': 69, 'C5': 72 }; // MIDI numbers

const state = {
  bpm: 92,
  key: 'C',
  chords: ['Am', 'F', 'C', 'G'],
  bars: 8,
  pattern: 'block',
  muteChords: false,
  muteArp: false
};

function loadState() {
  const saved = localStorage.getItem('pianoPocket');
  if (saved) Object.assign(state, JSON.parse(saved));
  document.getElementById('bpm').value = state.bpm;
  document.getElementById('key').value = state.key;
  document.getElementById('chords').value = state.chords.join(' ');
  document.getElementById('bars').value = state.bars;
  document.getElementById('pattern').value = state.pattern;
  document.getElementById('muteChords').checked = state.muteChords;
  document.getElementById('muteArp').checked = state.muteArp;
}
function saveState() {
  localStorage.setItem('pianoPocket', JSON.stringify(state));
}

async function loadSamples() {
  const names = ['A3', 'C4', 'A4', 'C5'];
  let loaded = 0;
  document.getElementById('status').textContent = `Loading samples 0/${names.length}`;
  for (const name of names) {
    try {
      const res = await fetch(`/samples/${name}.mp3`);
      if (!res.ok) throw new Error(name);
      const buf = await res.arrayBuffer();
      sampleBuffers[name] = buf;
      const audioBuf = await ctx.decodeAudioData(buf.slice(0));
      samples[name] = audioBuf;
      loaded++;
      document.getElementById('status').textContent = `Loading samples ${loaded}/${names.length}`;
    } catch (e) {
      document.getElementById('status').textContent = `Missing sample: ${name} piano`;
      return false;
    }
  }
  document.getElementById('status').textContent = 'Ready';
  return true;
}

function getClosestSample(midiNote) {
  let best = 'C4';
  let minDiff = 999;
  for (const [name, num] of Object.entries(noteMap)) {
    const diff = Math.abs(midiNote - num);
    if (diff < minDiff && diff <= 4) {
      minDiff = diff;
      best = name;
    }
  }
  return { name: best, shift: midiNote - noteMap[best] };
}

function parseChord(chord, rootOffset = 0) {
  // Simple parser for Am, F, C, G etc. Returns MIDI notes for triad
  const rootMap = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5, 'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11 };
  let rootName = chord.replace(/m|maj|min|7|sus/g, '');
  let isMinor = chord.includes('m') && !chord.includes('maj');
  let root = (rootMap[rootName] || 0) + rootOffset;
  root = ((root % 12) + 12) % 12;
  const intervals = isMinor ? [0, 3, 7] : [0, 4, 7];
  return intervals.map(i => 60 + root + i); // around C4
}

function scheduleStep(stepNum, time) {
  const stepDur = 60 / state.bpm / 4;
  const bar = Math.floor(stepNum / 16);
  const stepInBar = stepNum % 16;
  const chordIdx = Math.floor(stepInBar / 4) % 4;
  const chordNotes = parseChord(state.chords[chordIdx], 0); // key later
  // Apply key transpose
  const keyOffset = {C:0,G:7,D:2,A:9,E:4,B:11,'F#':6,Db:1,Ab:8,Eb:3,Bb:10,F:5}[state.key] || 0;
  const transposed = chordNotes.map(n => n + keyOffset);

  if (!state.muteChords && stepInBar % 4 === 0) {
    // Block chord on downbeats of each chord (every 4 16ths = quarter)
    transposed.forEach(note => playNote(note, time, stepDur * 4 * 0.9, 0.4));
  }
  if (!state.muteArp) {
    let arpNotes = [...transposed];
    if (state.pattern === 'arpdown') arpNotes.reverse();
    if (state.pattern === 'arpupdown') arpNotes = [...transposed, ...transposed.slice().reverse().slice(1, -1)];
    const arpIdx = stepInBar % arpNotes.length;
    playNote(arpNotes[arpIdx], time, stepDur * 0.8, 0.3);
  }
}

function playNote(midi, time, duration, velocity) {
  const { name, shift } = getClosestSample(midi);
  if (!samples[name]) return;
  const source = ctx.createBufferSource();
  source.buffer = samples[name];
  source.playbackRate.value = Math.pow(2, shift / 12);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(velocity, time + 0.01);
  gain.gain.setValueAtTime(velocity, time + duration - 0.02);
  gain.gain.linearRampToValueAtTime(0, time + duration);
  source.connect(gain);
  gain.connect(ctx.destination);
  source.start(time);
  source.stop(time + duration);
  activeSources.push(source);
  source.onended = () => { activeSources = activeSources.filter(s => s !== source); };
}

function scheduler() {
  while (nextStepTime < ctx.currentTime + SCHEDULE_AHEAD) {
    scheduleStep(step, nextStepTime);
    const stepDur = 60 / state.bpm / 4;
    nextStepTime += stepDur;
    step = (step + 1) % (state.bars * 16);
  }
}

function start() {
  if (!ctx) {
    ctx = new AudioContext();
    loadSamples().then(ok => { if (ok) startPlayback(); });
    return;
  }
  if (ctx.state === 'suspended') ctx.resume();
  startPlayback();
}
function startPlayback() {
  isPlaying = true;
  nextStepTime = ctx.currentTime + 0.1;
  step = 0;
  timerId = setInterval(scheduler, LOOKAHEAD_MS);
  document.getElementById('play').disabled = true;
  requestAnimationFrame(updatePlayhead);
}
function stop() {
  isPlaying = false;
  if (timerId) clearInterval(timerId);
  activeSources.forEach(s => { try { s.stop(); } catch(e){} });
  activeSources = [];
  document.getElementById('play').disabled = false;
  document.getElementById('progress').style.width = '0%';
}
function updatePlayhead() {
  if (!isPlaying || !ctx) return;
  const total = state.bars * 4 * 60 / state.bpm;
  const progress = (ctx.currentTime % total) / total * 100;
  document.getElementById('progress').style.width = progress + '%';
  requestAnimationFrame(updatePlayhead);
}

// Event listeners
document.getElementById('play').onclick = start;
document.getElementById('stop').onclick = stop;
document.getElementById('bpm').onchange = e => { state.bpm = +e.target.value; saveState(); };
document.getElementById('key').onchange = e => { state.key = e.target.value; saveState(); };
document.getElementById('chords').onchange = e => { state.chords = e.target.value.split(/\s+/).slice(0,4); saveState(); };
document.getElementById('bars').onchange = e => { state.bars = +e.target.value; saveState(); };
document.getElementById('pattern').onchange = e => { state.pattern = e.target.value; saveState(); };
document.getElementById('muteChords').onchange = e => { state.muteChords = e.target.checked; saveState(); };
document.getElementById('muteArp').onchange = e => { state.muteArp = e.target.checked; saveState(); };

document.getElementById('export').onclick = async () => {
  // Simplified export: for demo, alert. Full OfflineAudioContext would go here.
  // In production: render with OfflineAudioContext, fold tail, peak limit, download WAV + MIDI.
  alert('Export: In full version, generates piano-pocket-' + state.bpm + 'bpm-' + state.key + '.wav and .mid with exact grid length.');
};

document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
loadState();
document.body.addEventListener('click', () => { if (!ctx) start(); }, { once: true });
</script>
</body>
</html>
